name: CI

# Tests and clippy on every pull request and push to main.
on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: sh -n install.sh
      # The catalog (WMCAT-001): assets/catalog.json is what the merge makes
      # from lists/ and assets/suite-apps.txt, and the scripts' tests pass.
      - run: python3 scripts/merge_catalog.py --check
      - run: python3 -m unittest scripts/test_merge_catalog.py scripts/test_import_terminaltrove.py scripts/test_match_repology.py
