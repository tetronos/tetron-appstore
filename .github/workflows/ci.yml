name: CI

# Tests and clippy on every pull request and push to main.
on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/test_migration_equality.py reads the catalog before the move.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: sh -n install.sh
      # The catalog (ASCAT-009 to ASCAT-014, ASCAT-024): the generated files are
      # what the build makes from apps/ and collections/; the scripts' tests
      # pass; the spec's constraints hold.
      - run: python3 scripts/build_catalog.py --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 reconcile.py
