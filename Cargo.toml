[package]
name = "tetron-appstore"
version = "0.15.0"
edition = "2021"
rust-version = "1.95"
description = "A store for terminal apps (TUIs and command line tools): browse, install, launch"
license = "MIT"

[dependencies]
# The shared catalog library, also used by tetron-wm (WMCAT-008).
tetron-catalog = { path = "crates/tetron-catalog" }
crossterm = "0.29"
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
tetron-catalog = { path = "crates/tetron-catalog", features = ["builtin-only"] }

[workspace]
members = [".", "crates/tetron-catalog"]
# `cargo test` and `cargo clippy` cover the catalog library too.
default-members = [".", "crates/tetron-catalog"]

