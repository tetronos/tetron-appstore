[project]
name = "tetron-appstore-spec"
version = "0.1.0"
description = "Spec tooling for tetron-appstore. tetron-appstore itself is a Rust crate (Cargo.toml); this file only pins libspec."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
# Development only: `uv run libspec diff` reviews spec/ changes (spec-first workflow).
dev = ["libspec"]

[tool.uv]
package = false

[tool.uv.sources]
libspec = { git = "https://github.com/drhodes/libspec", tag = "v10.3.1" }
