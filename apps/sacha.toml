id = "sacha"
name = "sacha"
bin = "sacha"
category = "Dashboards"
description = "A two-pane AWS TUI for browsing, searching, and managing resources across seven services including CloudWatch Logs, S3, DynamoDB, Lambda, SSM, SQS, and EC2."
