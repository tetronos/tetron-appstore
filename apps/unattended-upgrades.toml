id = "unattended-upgrades"
name = "unattended-upgrades"
bin = "unattended-upgrade"
category = "Miscellaneous"
description = "Installs security updates automatically in the background on Debian and Ubuntu. Installing it turns automatic updates on; sudo dpkg-reconfigure unattended-upgrades turns them off. In no set: many users want to choose when updates happen."
homepage = "https://wiki.debian.org/UnattendedUpgrades"
cli = true

[install.pkg]
apt = "unattended-upgrades"

[source]
lists = ["tetron"]
