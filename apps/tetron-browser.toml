id = "tetron-browser"
name = "tetron-browser"
bin = "tetron-browser"
category = "TetronOS"
also_in = ["Web"]
description = "Chromium running inside your terminal: the maintained continuation of carbonyl (TetronOS package tetron-browser)"
homepage = "https://github.com/tetronos/tetron-browser"

[install.pkg]
apt = "tetron-browser"
dnf = ""
pacman = ""
brew = ""

[install.recipe]
install = "if command -v apt-get >/dev/null 2>&1; then $S curl -fsSLo /usr/share/keyrings/tetronos-archive-keyring.gpg https://tetronos.github.io/apt/tetronos-archive-keyring.gpg && $S curl -fsSLo /etc/apt/sources.list.d/tetronos.sources https://tetronos.github.io/apt/tetronos.sources && $S apt-get update && $S apt-get install -y tetron-browser; else { command -v unzip >/dev/null 2>&1 || { echo 'Installing unzip, which tetron-browser needs'; if command -v dnf >/dev/null 2>&1; then $S dnf install -y unzip; elif command -v pacman >/dev/null 2>&1; then $S pacman -S --needed --noconfirm unzip; elif command -v zypper >/dev/null 2>&1; then $S zypper -n install unzip; elif command -v apk >/dev/null 2>&1; then $S apk add unzip; fi; command -v unzip >/dev/null 2>&1 || { echo 'unzip could not be installed; install it and try again'; false; }; }; } && { [ \"$(uname -m)\" = x86_64 ] || { echo 'tetron-browser has no build for this CPU yet'; false; }; } && { f=tetron-browser.linux-amd64.zip; u=https://github.com/tetronos/tetron-browser/releases/latest/download; d=$(mktemp -d) && cd \"$d\" && curl -fsSLO $u/$f && curl -fsSLO $u/$f.sha256 && sha256sum -c $f.sha256 && mkdir -p ~/.local/bin && mkdir -p ~/.local/share/tetron-browser && unzip -oq $f -d ~/.local/share/tetron-browser && b=$(find ~/.local/share/tetron-browser -name tetron-browser -type f | head -1) && ln -sf \"$b\" ~/.local/bin/tetron-browser && cd / && rm -rf \"$d\"; }; fi"
method = "binary"
os = ["linux"]
verified = true

[source]
lists = ["tetron"]
