id = "ghui"
name = "ghui"
bin = "ghui"
category = "Development"
description = "A keyboard-driven terminal UI for your open GitHub pull requests across repositories: review diffs, leave comments, manage labels, toggle draft state, and merge without leaving the terminal. Requires the GitHub CLI (gh) installed and authenticated (gh auth login)."
homepage = "https://github.com/kitlangton/ghui"

[install.recipe]
install = "brew install kitlangton/tap/ghui"
method = "brew"
os = ["macos", "linux"]
verified = true

[source]
lists = ["tetron"]
