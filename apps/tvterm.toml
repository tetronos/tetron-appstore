id = "tvterm"
name = "tvterm"
bin = "tvterm"
category = "Productivity"
description = "A terminal emulator that runs in your terminal"
homepage = "https://github.com/magiblot/tvterm"

[install.recipe]
install = "git clone --recursive https://github.com/magiblot/tvterm && cd tvterm && cmake . -B ./build -DCMAKE_BUILD_TYPE=Release && cmake --build ./build"
method = "source"
os = ["linux", "macos"]
verified = true

[source]
lists = ["awesome-tuis", "tetron"]
