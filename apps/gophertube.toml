id = "gophertube"
name = "GopherTube"
bin = "gophertube"
category = "Multimedia"
description = "A terminal-based YouTube client that scrapes YouTube search results and uses mpv for video playback"
homepage = "https://github.com/krishnassh/gophertube"

[install.recipe]
install = "curl -sSL https://raw.githubusercontent.com/KrishnaSSH/GopherTube/main/install.sh | bash"
method = "script"
os = ["macos", "linux"]
verified = true

[source]
lists = ["awesome-tuis", "tetron"]
