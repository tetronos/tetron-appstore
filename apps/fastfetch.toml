id = "fastfetch"
name = "fastfetch"
bin = "fastfetch"
category = "Miscellaneous"
description = "Like neofetch, but much faster."
homepage = "https://github.com/fastfetch-cli/fastfetch"
cli = true

[install.pkg]
apt = "fastfetch"
dnf = "fastfetch"
pacman = "fastfetch"
brew = "fastfetch"

[install.release]
repo = "fastfetch-cli/fastfetch"
amd64 = "fastfetch-linux-amd64.deb"
arm64 = "fastfetch-linux-aarch64.deb"

[install.recipe]
install = "brew install fastfetch"
method = "brew"
verified = true

[source]
lists = ["terminaltrove", "tetron"]
