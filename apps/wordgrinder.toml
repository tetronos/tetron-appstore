id = "wordgrinder"
name = "wordgrinder"
bin = "wordgrinder"
category = "Productivity"
description = "Distraction-free Unicode word processor for the terminal."
homepage = "https://github.com/davidgiven/wordgrinder"

[install.pkg]
apt = "wordgrinder"
