id = "lazytrivy"
name = "lazytrivy"
bin = "lazytrivy"
category = "Docker/LXC/K8s"
description = "The lazier way to scan images, k8s and the filesytem with Trivy"
homepage = "https://github.com/owenrumney/lazytrivy"
cli = true

[install.recipe]
install = "brew tap owenrumney/tools && brew install lazytrivy"
method = "brew"
os = ["macos", "linux", "windows"]
verified = true

[source]
lists = ["awesome-tuis", "tetron"]
