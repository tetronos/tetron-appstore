id = "croft"
name = "croft"
bin = "croft"
category = "Development"
description = "A VS Code style IDE in the terminal: Explorer, editor with LSP and tree-sitter, terminal panel, Source Control, debugging. Icons need a Nerd Font (tetronos-nerd-font-symbols); updates itself (Ctrl+Shift+F9)."
homepage = "https://github.com/vitali87/croft"

[notes]
how = "its musl release for this CPU, checked against the release's SHA256SUMS, into ~/.local/bin (Linux); it updates itself"

[install]
script = "croft"

[install.recipe]
install = "f=croft-$(uname -m)-unknown-linux-musl; u=https://github.com/vitali87/croft/releases/latest/download; d=$(mktemp -d) && cd \"$d\" && curl -fsSLO $u/$f.tar.gz && curl -fsSLO $u/SHA256SUMS && sha256sum -c --ignore-missing SHA256SUMS && tar xzf $f.tar.gz && mkdir -p ~/.local/bin && install -m 755 $f/croft ~/.local/bin/croft && cd / && rm -rf \"$d\""
method = "binary"
os = ["linux"]
verified = true

[source]
lists = ["tetron"]
