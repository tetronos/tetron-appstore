id = "sssnake"
name = "sssnake"
bin = "sssnake"
category = "Games"
description = "The classic snake game for the terminal that can play itself and be used like a screensaver."
homepage = "https://github.com/AngelJumbo/sssnake"

[install.recipe]
install = "git clone https://github.com/AngelJumbo/sssnake.git && cd sssnake && make && sudo make install"
method = "source"
os = ["macos", "linux"]
verified = true

[source]
lists = ["awesome-tuis", "tetron"]
